name: Patchy UI
options:
  bundleIdPrefix: com.87dash
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en
packages:
  PatchyKit:
    path: PatchyKit
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: "2.6.0"
targets:
  Patchy UI:
    type: application
    platform: macOS
    sources:
      - PatchyUI
    dependencies:
      - package: PatchyKit
      - package: Sparkle
    info:
      path: PatchyUI/Info.plist
      properties:
        CFBundleDisplayName: Patchy UI
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        LSApplicationCategoryType: public.app-category.developer-tools
        LSMinimumSystemVersion: $(MACOSX_DEPLOYMENT_TARGET)
        NSHumanReadableCopyright: "Copyright © 2026 Joshua Omilian. MIT License."
        # Sparkle. The feed is appcast.xml on this repo's GitHub Pages; scripts/release.sh regenerates it.
        SUFeedURL: https://jeso87.github.io/Patchy-UI/appcast.xml
        # Public half of the EdDSA key release.sh signs updates with (the private half is in the login keychain).
        SUPublicEDKey: WJdCmygGtLYY1evpoPN3z8zQIJg3FZ3b108A27ynfd8=
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.87dash.PatchyUI
        PRODUCT_NAME: Patchy UI
        # MARKETING_VERSION is the Patchy release this build supports (see PatchyCompatibility).
        # For an app-only fix on the same Patchy release, add a fourth part: 1.2.1.1.
        MARKETING_VERSION: "1.3.0"
        # Sparkle compares this number, not the marketing version. Raise it for every release.
        CURRENT_PROJECT_VERSION: "7"
        SWIFT_VERSION: "5.0"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        # Localization. Only this target: PatchyKit and the tests stay English.
        DEVELOPMENT_LANGUAGE: en
        SWIFT_EMIT_LOC_STRINGS: YES
        # Sparkle's 36 languages, so the app and its update dialog never disagree.
        KNOWN_REGIONS: [en, ar, ca, cs, da, de, el, es, fa, fi, fr, he, hr,
                        hu, is, it, ja, ko, nb, nl, nn, pl, pt-BR, pt-PT, ro,
                        ru, sk, sl, sv, th, tr, uk, vi, zh-Hans, zh-Hant,
                        zh-HK]
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LY424U3HLD
  PatchyUITests:
    type: bundle.unit-test
    platform: macOS
    sources:
      - PatchyUITests
    dependencies:
      - target: Patchy UI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.87dash.PatchyUITests
        # xcodegen's unit-test template generates no Info.plist; without one, signing fails.
        GENERATE_INFOPLIST_FILE: YES
        SWIFT_VERSION: "5.0"
        CODE_SIGN_STYLE: Automatic
        DEVELOPMENT_TEAM: LY424U3HLD
        # Hosted, so tests can `@testable import Patchy_UI` and resolve strings through the
        # app's own catalog (Bundle.main is the app).
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/Patchy UI.app/Contents/MacOS/Patchy UI"
        BUNDLE_LOADER: "$(TEST_HOST)"
schemes:
  Patchy UI:
    build:
      targets:
        Patchy UI: all
        PatchyUITests: [test]
    run:
      config: Debug
    test:
      config: Debug
      targets: [PatchyUITests]
      # The copy tests pin English. Run them in English whatever this Mac is set to.
      commandLineArguments:
        "-AppleLanguages (en)": true
        "-AppleLocale en_US": true
    profile:
      config: Release
    analyze:
      config: Debug
    archive:
      config: Release
